name: Generate PDF Preview

on:
  push:
    paths:
      - 'TeX/report.pdf' # Runs only when this file is modified

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poppler utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render first page to PNG
        run: |
          # Converts page 1 (-f 1 -l 1) at 150 DPI (-r 150) directly to TeX/preview.png
          pdftoppm -png -r 150 -f 1 -l 1 -singlefile TeX/report.pdf TeX/preview

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TeX/preview.png
          if git diff --staged --quiet; then
            echo "No changes in preview image."
          else
            git commit -m "chore: auto-update report preview [skip ci]"
            git push
          fi
